function getMove(ci,kind){
 const C=CHARS[ci];let m;
 if(kind==='special')m=Object.assign({},SPECIAL[C.special]);
 else if(kind==='ult')m=Object.assign({},ULT[C.ult]);
 else{m=Object.assign({},BASE[kind]);const fs=C.scale>1.2?1.25:C.weapon==='daggers'?.8:1;
  m.s=Math.round(m.s*fs);m.r=Math.round(m.r*fs);m.dmg*=C.str;m.kb*=Math.sqrt(C.str);
  if(kind==='heavy')Object.assign(m,C.heavy)}
 m.kind=kind;return m;
}
const isAtk=F=>!!F.mv&&(F.act==='light'||F.act==='heavy'||F.act==='special'||F.act==='ult');
function poseOf(F){
 const k=F.at,a=F.act;
 if(a==='ko')return lp(HIT,KO,ease(clamp(k/20,0,1)));
 if(a==='hit')return lp(HIT,IDLE,clamp(k/(F.stunMax||12),0,1)*.5);
 if(a==='block')return BLOCK;
 if(a==='dash'){const p=Object.assign({},F.dashD>0?DASHF:DASHB);if(F.dashD>0){const ph=k*.5;p.fl1+=Math.sin(ph)*.4;p.bl1-=Math.sin(ph)*.4}return p}
 if(isAtk(F)){
  const m=F.mv,W1=m.pw||L_WIND,H1=m.ph||L_HIT;
  if(m.leap&&!F.ground&&k>=m.s)return Object.assign({},H_WIND,{fl1:1.1,fl2:.1,bl1:.4,bl2:-.6});
  let p;
  if(k<m.s)p=lp(IDLE,W1,ease(k/m.s));
  else if(k<m.s+m.a)p=lp(W1,H1,clamp((k-m.s+1)/2,0,1));
  else p=lp(H1,IDLE,ease(clamp((k-m.s-m.a)/m.r,0,1)));
  const act=k>=m.s&&k<m.s+m.a;
  if(m.spinFx&&act){p.wa=1.57+(k-m.s)*.55;p.fa1=p.wa;p.fa2=p.wa}
  if(m.flurry&&act){const q=Math.sin((k-m.s)*1.2);p.wa=1.57+q*1.2;p.fa2=1.4+q*.8;p.ba2=1.6-q*.8}
  if(F.ground===false&&!m.leap){p.fl1=1.1;p.fl2=.1;p.bl1=.4;p.bl2=-.6}
  return p;
 }
 if(F.ground===false)return Object.assign({},F.flying?FLY:JUMP);
 const p=Object.assign({},IDLE);
 if(a==='walk'){const ph=k*.22;p.fl1=Math.sin(ph)*.55;p.fl2=p.fl1-.45*Math.max(0,Math.sin(ph+1.6));
  p.bl1=-Math.sin(ph)*.55;p.bl2=p.bl1-.45*Math.max(0,-Math.sin(ph+1.6));p.hy=Math.abs(Math.cos(ph))*.8;return p}
 p.hy=1+Math.sin(k*.07)*.8;return p;
}

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 const f=v=>clamp(Math.round(a<0?v*(1+a):v+(255-v)*a),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function Lp(c,a,b,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(const p of pts)c.lineTo(p.x,p.y);c.closePath();c.fill()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.5,r),0,7);c.fill()}
function rc(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x-w/2,y-h/2,w,h)}
const mix=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function txt(s,x,y,size,col,al='left',sh='#000'){ctx.font=size+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
 if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function wrap(t,n){const w=t.split(' '),out=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){out.push(l.trim());l=x}else l+=' '+x}if(l.trim())out.push(l.trim());return out}

function skel(x,y,f,s,p){
 const lu=11,ll=11,T=17,au=9,al=9;
 const ext=Math.max(lu*Math.cos(p.fl1)+ll*Math.cos(p.fl2),lu*Math.cos(p.bl1)+ll*Math.cos(p.bl2));
 const pt=(b,a,l)=>({x:b.x+f*Math.sin(a)*l*s,y:b.y+Math.cos(a)*l*s});
 const hip={x,y:y-ext*s+p.hy*s};
 const neck=pt(hip,Math.PI-p.lean,T),head=pt(neck,Math.PI-p.lean,5.5),sh=pt(neck,-p.lean,2);
 const la=p.lean*.5;
 const fe=pt(sh,p.fa1+la,au),fh=pt(fe,p.fa2+la,al),be=pt(sh,p.ba1+la,au),bh=pt(be,p.ba2+la,al);
 const fk=pt(hip,p.fl1,lu),ff=pt(fk,p.fl2,ll),bk=pt(hip,p.bl1,lu),bf=pt(bk,p.bl2,ll);
 return{hip,neck,head,sh,fe,fh,be,bh,fk,ff,bk,bf,wa:p.wa+la,ba:p.ba2+la+.5};
}
function drawWeapon(c,type,h,a,f,s,C){
 const dx=f*Math.sin(a),dy=Math.cos(a),nx=f*Math.cos(a),ny=-Math.sin(a);
 const Q=(t,u=0)=>({x:h.x+dx*t*s+nx*u*s,y:h.y+dy*t*s+ny*u*s});
 const steel='#b9c0c9',dark='#2e2826',wood='#5a3a22';
 switch(type){
 case'sword':Lp(c,Q(-4),Q(2),2*s,dark);Lp(c,Q(1,-4),Q(1,4),1.6*s,'#8a7a50');
  poly(c,[Q(2,-1.3),Q(26,-1),Q(30,0),Q(26,1),Q(2,1.3)],steel);Lp(c,Q(3),Q(25),.6*s,'#7f8794');break;
 case'rusty':Lp(c,Q(-3),Q(1),1.6*s,dark);poly(c,[Q(1,-1.2),Q(16,-.8),Q(18,0),Q(16,1),Q(1,1.2)],'#8a6a50');break;
 case'hammer':Lp(c,Q(-6),Q(28),2.2*s,wood);poly(c,[Q(23,-7),Q(33,-7),Q(33,7),Q(23,7)],'#4b4e55');
  poly(c,[Q(24,-6),Q(32,-6),Q(32,-3),Q(24,-3)],'#6b6f78');poly(c,[Q(26,7),Q(28,12),Q(30,7)],'#3a3c42');break;
 case'axe':Lp(c,Q(-6),Q(30),2*s,wood);poly(c,[Q(20,0),Q(17,9),Q(25,13),Q(33,9),Q(30,0)],steel);
  Lp(c,Q(18,9),Q(32,9),.8*s,'#e8ecf0');poly(c,[Q(24,0),Q(27,-5),Q(29,0)],'#888');break;
 case'daggers':Lp(c,Q(-2),Q(1),1.8*s,dark);Lp(c,Q(1,-2),Q(1,2),1.2*s,'#777');poly(c,[Q(1,-1),Q(12,0),Q(1,1)],steel);break;
 case'spear':Lp(c,Q(-14),Q(40),1.6*s,wood);poly(c,[Q(38,-2.2),Q(49,0),Q(38,2.2)],'#cfe8ff');
  poly(c,[Q(34,0),Q(36,0),Q(35,5),Q(32,6)],C.acc);break;
 case'scythe':Lp(c,Q(-8),Q(36),2*s,'#2a2420');c.strokeStyle='#a9b8a2';c.lineWidth=2.4*s;c.beginPath();
  {const p0=Q(35,0),p1=Q(44,-9),p2=Q(30,-20);c.moveTo(p0.x,p0.y);c.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y);c.stroke();
  c.strokeStyle=C.acc;c.lineWidth=.8*s;c.stroke()}break;
 case'twin':Lp(c,Q(-3),Q(1),1.8*s,dark);Lp(c,Q(1,-2.5),Q(1,2.5),1.2*s,C.acc);c.strokeStyle='#d8c0c0';c.lineWidth=2*s;c.beginPath();
  {const p0=Q(1),p1=Q(13,2),p2=Q(22,-1.5);c.moveTo(p0.x,p0.y);c.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y);c.stroke()}break;
 case'glaive':Lp(c,Q(-10),Q(30),1.8*s,'#3a3a46');poly(c,[Q(28,-2.5),Q(44,-1),Q(48,0),Q(44,1.2),Q(28,1.6)],'#e6e9f2');
  poly(c,[Q(30,-2.5),Q(33,-6),Q(34,-2.5)],'#c0c6d4');circ(c,Q(28).x,Q(28).y,1.4*s,'#6fa8ff');break;
 }
}
function drawShield(c,C,h,f,s,T){
 if(C.shield==='kite'){const p=(u,v)=>({x:h.x+f*u*s,y:h.y+v*s});
  poly(c,[p(-4,-7),p(4,-7),p(5,-2),p(0,8),p(-5,-2)],T||shade(C.col,-.45));
  poly(c,[p(-3,-6),p(3,-6),p(4,-2),p(0,6),p(-4,-2)],T||'#3b3e46');rc(c,h.x,h.y-1*s,1.4*s,10*s,C.acc);rc(c,h.x,h.y-3*s,7*s,1.4*s,C.acc);}
 else{circ(c,h.x,h.y,7.5*s,T||'#888');circ(c,h.x,h.y,6.6*s,T||'#5e3d22');circ(c,h.x,h.y,6.6*s*.55,C.acc);circ(c,h.x,h.y,1.8*s,'#aaa')}

const cellXY=i=>({x:151+(i%4)*46,y:24+(i/4|0)*46});
function stepPrev(p){p.at++;
 if(p.act==='idle'&&p.at>45){const seq=['light','heavy','special','ult'];p.mv=getMove(p.ci,seq[p.demo++%4]);p.act=p.mv.kind;p.at=0;if(p.mv.leap)p.mv.a=20}
 else if(p.mv&&p.at>=p.mv.s+Math.min(p.mv.a,30)+p.mv.r+10){p.act='idle';p.mv=null;p.at=0}}
function moveCur(side,dx,dy){if(sel.lock[side])return;let i=sel.c[side],col=(i%4+dx+4)%4,row=((i/4|0)+dy+2)%2;setCur(side,row*4+col)}
function setCur(side,i){if(sel.lock[side]||sel.c[side]===i)return;sel.c[side]=i;sel.pv[side]=mkPrev(i);sel.desc=i;sfx('tick');netPick(side)}
function lockCur(side){if(sel.lock[side])return;sel.lock[side]=true;sfx('select');const p=sel.pv[side];p.mv=getMove(p.ci,'ult');p.act='ult';p.at=0;if(p.mv.leap)p.mv.a=20;netPick(side)}
function netPick(side){if((mode==='host'&&side===0)||(mode==='guest'&&side===1))send({t:'pick',side,c:sel.c[side],l:sel.lock[side]})}
function stepSelect(){
 sel.pv.forEach(stepPrev);
 const online=mode==='host'||mode==='guest',me=mode==='guest'?1:0;
 const ctl=mode==='local'?[[0,'p1'],[1,'p2']]:[[me,'p1'],[me,'p2']];
 for(const[side,set]of ctl){const nav=set==='p1'?['KeyA','KeyD','KeyW','KeyS']:['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  if(anyP([nav[0]]))moveCur(side,-1,0);if(anyP([nav[1]]))moveCur(side,1,0);if(anyP([nav[2]]))moveCur(side,0,-1);if(anyP([nav[3]]))moveCur(side,0,1);
  const ok=set==='p1'?['KeyF','Space']:['Comma','Numpad1','Enter'];if(mode!=='local')ok.push('Enter');if(anyP(ok))lockCur(side)}
 const mside=mode==='local'?(sel.lock[0]?1:0):me;
 for(let i=0;i<8;i++){const{x,y}=cellXY(i);if(inR(x,y,40,40)){if(mouse.moved){setCur(mside,i);sel.desc=i}if(mouse.click){setCur(mside,i);lockCur(mside)}}}
 if(anyP(['Escape'])){if(online){send({t:'bye'});netDrop('');scene='menu';return}
  if(sel.lock[1]&&mode==='local')sel.lock[1]=false;else if(sel.lock[0])sel.lock[0]=sel.lock[1]=false;else{scene='menu';return}}
 if(mode==='cpu'&&sel.lock[0]&&!sel.lock[1]){sel.cpu++;if(sel.cpu%4===0){const i=Math.random()*8|0;if(i!==sel.c[1]){sel.c[1]=i;sel.pv[1]=mkPrev(i);sfx('tick')}}if(sel.cpu>40)lockCur(1)}
 if(sel.lock[0]&&sel.lock[1]){sel.st++;if(sel.st>70&&mode!=='guest'){if(mode==='host')send({t:'start',a:sel.c[0],b:sel.c[1]});startMatch(sel.c[0],sel.c[1])}}else sel.st=0;
}
function drawSelect(){
 const pb=[0,1].map(side=>{const p=sel.pv[side];lerpBS(PBS[side],beastTarget(p,-1));return{b:CHARS[p.ci].beast,x:side?440:40,gy:180,f:side?-1:1,st:PBS[side],k:.62,seed:side*40}});
 drawBG(pb);ctx.fillStyle='rgba(5,2,6,.55)';ctx.fillRect(0,0,W,H);
 txt('WAEHLE DEINEN KAEMPFER',W/2,8,8,'#d4a937','center');
 for(let i=0;i<8;i++){const{x,y}=cellXY(i),C=CHARS[i];
  const g=ctx.createLinearGradient(0,y,0,y+40);g.addColorStop(0,'#2a1418');g.addColorStop(1,'#0c0608');ctx.fillStyle=g;ctx.fillRect(x,y,40,40);
  ctx.save();ctx.beginPath();ctx.rect(x,y,40,40);ctx.clip();const k=1.15;drawFighter(ctx,C,x+20,y+6+50*C.scale*k,1,IDLE,k);ctx.restore();
  ctx.strokeStyle='#4a3a2a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,39,39)}
 const lab=mode==='cpu'?['1P','CPU']:mode==='local'?['1P','2P']:mode==='host'?['DU','GEGNER']:['GEGNER','DU'];
 [0,1].forEach(side=>{const{x,y}=cellXY(sel.c[side]),col=side?'#3a7be0':'#e03030',o=sel.c[0]===sel.c[1]&&side?2:0;
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(x+1+o,y+1+o,38-o*2,38-o*2);if(!sel.lock[side]||tick%30<20)txt(lab[side],side?x+39:x+1,side?y+31:y+2,8,col,side?'right':'left')});
 [0,1].forEach(side=>{const C=CHARS[sel.c[side]],cx=side?408:72,p=sel.pv[side];
  txt(C.name,cx,22,8,side?'#7aa8f0':'#f07070','center');txt(C.title,cx,34,8,'#a89a80','center');txt(C.origin,cx,46,8,'#7a6e5a','center');
  txt('Bestie: '+C.beast.name,cx,58,8,'#8a5a50','center');
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(cx,192,26,4,0,0,7);ctx.fill();
  drawFighter(ctx,C,cx,190,side?-1:1,poseOf(p),1.5,{flap:C.fly&&p.act!=='idle'?1:0});
  ['KRAFT','TEMPO','REICHW.','RUESTG.'].forEach((s,j)=>{const yy=202+j*11;txt(s,cx-62,yy,8,'#8a7e66');
   for(let b=0;b<5;b++){ctx.fillStyle=b<C.stats[j]?(side?'#3a7be0':'#c02a2a'):'#2a2024';ctx.fillRect(cx+6+b*11,yy,9,7)}});
  if(sel.lock[side])txt('BEREIT!',cx,72,16,'#f0d080','center','#400')});
 const D=CHARS[sel.desc];let y=118;
 txt('SPEZIAL: '+D.sname,W/2,y,8,'#c9a2ff','center');txt('ULT: '+D.uname,W/2,y+11,8,'#ffb040','center');
 txt(D.passive+':',W/2,y+22,8,'#6fc8a0','center');txt(PASSIVE[D.passive],W/2,y+33,8,'#4f9878','center');
 wrap(D.lore,22).forEach((l,i)=>txt(l,W/2,y+48+i*11,8,'#cfc3a8','center'));
 const hint=mode==='local'?'1P: WASD+F   2P: PFEILE+,':'WASD/PFEILE + F/ENTER/KLICK';txt(hint,W/2,258,8,'#5e5446','center');
 if(mode==='guest'&&sel.lock[0]&&sel.lock[1])txt('Warte auf Host...',W/2,108,8,'#8a8','center');
}

// ---------------------------------------------------------- HAUPTSCHLEIFE
function step(){
 for(const e of embers){e.x+=e.vx;e.y+=e.vy;if(e.y<0){e.y=H;e.x=Math.random()*W}}
 for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l--;if(p.y>=GROUND+2&&p.g>0){p.y=GROUND+2;p.vx=0;p.vy=0}}
 parts=parts.filter(p=>p.l>0);if(parts.length>900)parts.splice(0,parts.length-900);if(shake>0)shake=Math.max(0,shake-.5);
 if(scene==='menu')stepMenu();else if(scene==='controls')stepControls();else if(scene==='online')stepOnline();
 else if(scene==='select')stepSelect();else if(scene==='fight'&&G)stepFight();
}
function draw(){ctx.clearRect(0,0,W,H);
 if(scene==='menu')drawMenu();else if(scene==='controls')drawControls();else if(scene==='online')drawOnline();
 else if(scene==='select')drawSelect();else if(scene==='fight'&&G)drawFight();}
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=DT){acc-=DT;step();tick++;pressed.clear();mouse.click=false;mouse.moved=false}
 draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
